# Fast, lightweight checks only (< ~5 min). Instrumented/emulator tests are
# intentionally NOT part of CI to conserve GitHub-hosted runner minutes; run
# them locally with `gradlew connectedDebugAndroidTest` against an AVD.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.idea/**'
      - '*.png'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.idea/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lint assembleDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
